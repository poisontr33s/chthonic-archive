host:
  os: "Windows 11 x64 (Build 26100)"
  cpu: "Intel Core i9-13900K (Raptor Lake, LGA1700)"
  cpu_cores: "24 (8 P-core / 16 E-core), 32 threads"
  cpu_boost_p: "5.8 GHz (P-core max)"
  cpu_l3: "36 MB"
  gpu: "NVIDIA GeForce RTX 4090"
  gpu_arch: "Ada Lovelace (SM 8.9)"
  gpu_sm_count: 128
  gpu_cuda_cores: 16384
  gpu_rt_cores: "3rd generation"
  gpu_tensor_cores: "4th generation (FP8 / INT8 / FP16 / BF16)"
  gpu_vram: "24 GB GDDR6X"
  gpu_driver: "596.21"
  gpu_dlss: "4.5"
  monitor: "AOC AGON PRO AG276QZD (QD-OLED, 1440p 240Hz, HDR True Black 400)"

ruby:
  version: "4.0.3"
  description: "ruby 4.0.3 (2026-04-21) +ZJIT +PRISM [x64-mingw-ucrt]"
  jit_flags: "+ZJIT +YJIT"
  parser: "+PRISM"
  platform: "x64-mingw-ucrt"
  binary_source_build: 'C:\ruby-zjit-build\ruby-4.0.3\ruby.exe'
  binary_rv_standard: '%APPDATA%\rv\rubies\ruby-4.0.3\bin\ruby.exe'
  binary_rv_zjit_stub: '%APPDATA%\rv\rubies\ruby-4.0.3-zjit\bin\ruby.exe'
  rv_version: "0.5.3"
  known_issue: >
    ruby-4.0.3-zjit (rv bin-only stub) + --zjit -e "require 'prism'" → AV 0xC0000005
    (rb_shape_free_all, shape-system DLL mismatch). Use Podman lane for ZJIT+Prism.

toolchain:
  msys2_root: '%APPDATA%\rv\rubies\ruby-4.0.3\msys64'
  ucrt64_bin: '%APPDATA%\rv\rubies\ruby-4.0.3\msys64\ucrt64\bin'
  gcc: "GCC 14.x (UCRT64 / MinGW-w64)"
  gpp: "G++ 14.x (UCRT64 / MinGW-w64)"
  make: "mingw32-make"
  ar: "ar (binutils, UCRT64)"

sdks:
  cuda:
    version: "13.2"
    active_path: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2'
    also_installed: ["12.8", "12.9"]
    nvcc: "Cuda compilation tools, release 13.2, V13.2.51"
    key_headers: [cuda_runtime_api.h, cuda.h, nvrtc.h, nvml.h]
    key_libs: [cudart, cublas, cufft, curand, cusolver, nvrtc, cublas_lt]
    lib_path_win32: 'lib\x64'
    lib_path_linux: 'lib64'
    detection: "env CUDA_PATH or glob C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v*"

  cudnn:
    version: "9.20"
    path: 'C:\Program Files\NVIDIA\CUDNN\v9.20'
    header_layout: 'include\<cuda-ver>\cudnn.h'
    header_note: "v9.x no longer uses flat include/cudnn.h — must glob include/**/cudnn.h"
    key_libs: [cudnn, cudnn_ops, cudnn_cnn, cudnn_adv]
    detection: "env CUDNN_PATH or glob C:\\Program Files\\NVIDIA\\CUDNN\\v*"

  tensorrt:
    version: "10.16.0.72"
    path: 'C:\Program Files\NVIDIA\TensorRT-10.16.0.72'
    nvinfer_lib_win32: "nvinfer_10"   # versioned name on Win32
    nvinfer_lib_linux: "nvinfer"
    requires_cxx17: true
    key_headers: [NvInfer.h, NvInferRuntime.h, NvInferPlugin.h]
    detection: "env TRT_PATH or glob C:\\Program Files\\NVIDIA\\TensorRT-*"

  vulkan:
    version: "1.4.341.1"
    sdk_path: 'C:\VulkanSDK\1.4.341.1'
    env_var: VULKAN_SDK
    shader_tools:
      glslc:           "Bin/glslc.exe"           # GLSL/HLSL → SPIR-V
      dxc:             "Bin/dxc.exe"             # HLSL → SPIR-V (DXIL also)
      spirv_cross:     "Bin/spirv-cross.exe"     # SPIR-V → GLSL/HLSL/MSL
      spirv_opt:       "Bin/spirv-opt.exe"       # SPIR-V optimizer
      spirv_val:       "Bin/spirv-val.exe"       # SPIR-V validator
      spirv_dis:       "Bin/spirv-dis.exe"       # SPIR-V disassembler
      slangc:          "Bin/slangc.exe"          # Slang compiler (Khronos/NVIDIA)
      slangd:          "Bin/slangd.exe"          # Slang language server
      glslang_validator: "Bin/glslangValidator.exe"
      vulkaninfo:      "Bin/vulkaninfoSDK.exe"
    detection: "env VULKAN_SDK or glob C:\\VulkanSDK\\*"

  nvapi:
    status: available_separately
    source: "https://developer.nvidia.com/rtx/path-tracing/nvapi/get-started"
    notes: "Not in CUDA toolkit — must download NvAPI SDK independently"

