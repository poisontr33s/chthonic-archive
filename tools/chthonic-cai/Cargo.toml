[package]
name = "chthonic-cai"
version = "0.1.0"
edition = "2024"
description = "Gamified Copilot CLI companion — XP-driven REPL wrapping gh copilot suggest/explain."
license = "WTFPL"

[[bin]]
name = "cai"
path = "src/main.rs"

[dependencies]
anyhow    = "1.0"
clap      = { version = "4", features = ["derive"] }
crossterm = "0.29"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
chrono    = { version = "0.4", features = ["serde"] }
