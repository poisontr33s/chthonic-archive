[package]
name        = "chthonic-mcp-server"
version     = "0.1.0"
edition     = "2024"
description = "Chthonic polyglot CLI router as a stdio MCP server (rmcp 2.x). Modern Rust port of the bun chthonic-v3 server — wraps scripts/chthonic.ps1, drops toolchain runners redundant with Bash + the git MCP server."

[[bin]]
name = "chthonic-mcp-server"
path = "src/main.rs"

[dependencies]
rmcp               = { version = "2.1", features = ["server", "macros", "transport-io"] }
tokio              = { version = "1",   features = ["macros", "rt-multi-thread", "process", "io-std", "fs"] }
serde              = { version = "1",   features = ["derive"] }
schemars           = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
