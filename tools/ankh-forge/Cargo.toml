[package]
name = "ankh-forge"
version = "0.1.0"
edition = "2024"
description = "Rust-native WPTG acceleration CLI for extension scanning, census, and file intelligence."
license = "WTFPL"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.0", features = ["derive"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"
