[package]
name = "ankh-forge"
version = "0.1.0"
edition = "2024"
description = "Rust-native WPTG acceleration CLI for extension scanning, census, and file intelligence."
license = "WTFPL"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
flate2 = "1.1"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
bincode = { version = "2.0", features = ["std"] }

[dev-dependencies]
tempfile = "3.27"
