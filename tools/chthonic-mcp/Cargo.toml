[package]
name        = "chthonic-mcp"
version     = "0.1.0"
edition     = "2024"
description = "Chthonic Archive manifest portal — Copilot SDK MCP server injecting session context, corpus ranking, and gate telemetry into the system message."

[[bin]]
name = "chthonic-mcp"
path = "src/main.rs"

[dependencies]
github-copilot-sdk = { version = "1.0.4", features = ["derive"] }
tokio              = { version = "1",             features = ["full"] }
anyhow             = "1"
serde              = { version = "1",   features = ["derive"] }
serde_json         = "1"
schemars           = "1"
async-trait        = "0.1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono             = { version = "0.4", features = ["clock"] }
