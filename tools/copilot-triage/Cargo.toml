[package]
name = "copilot-triage"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "copilot-triage"
path = "src/main.rs"

[dependencies]
github-copilot-sdk = { version = "1.0.0-beta.9", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
