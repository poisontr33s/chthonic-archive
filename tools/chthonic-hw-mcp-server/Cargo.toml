[package]
name        = "chthonic-hw-mcp-server"
version     = "0.1.0"
edition     = "2024"
description = "Native hardware/driver environment MCP server — WMI + Win32 DLL VersionInfo + NVML, no PowerShell subprocess on the hot path."

[dependencies]
rmcp               = { version = "2.1", features = ["server", "macros", "transport-io"] }
tokio              = { version = "1",   features = ["macros", "rt-multi-thread", "process", "io-std", "fs"] }
serde              = { version = "1",   features = ["derive"] }
serde_json         = "1"
schemars           = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wmi                = "0.18.4"
nvml-wrapper       = "0.12.1"
windows            = { version = "0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
pulldown-cmark = "0.13.4"
