[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tabby_modern"]

[project]
name = "tabby-modern"
version = "0.1.0"
description = "Modern GPU inference host — Python 3.14 / uv / exllamav3 / Podman CDI"
requires-python = ">=3.14"
dependencies = [
    "fastapi-slim >= 0.115",

    # pydantic 2.13+ → pydantic-core 2.46.x → PyO3 0.25.x → cp314 wheels (FAF Gate 2)
    # pydantic-settings is the config primary — no ruamel.yaml, no YAML-first paradigm
    "pydantic >= 2.13.0,<3",
    "pydantic-settings >= 2.3.0",

    "uvicorn[standard] >= 0.28.1",
    "jinja2 >= 3.0.0",
    "loguru >= 0.7.0",
    "sse-starlette >= 2.2.0",
    "tokenizers >= 0.21.0",

    # Gate 7 — formatron cessation trajectory (FAF Gate 7, warning_degraded on 3.14)
    # Bare-string \A \z \[ in formatron/formats/json.py:116, formatron/schemas/json_schema.py:72
    # Cessation boundary: ~Python 3.16 — SyntaxError. Pin <1.0 as major-API sentinel.
    # Upstream: GuidoGuardiani/formatron — no fix as of 2026-04-25.
    # FAF: docs/reference/FAF_TABBYAPI_PY314_GPU_INFERENCE_HOST.md#gate-7
    "formatron >= 0.4.11,<1.0",

    "kbnf >= 0.4.1",
    "aiofiles >= 24.0.0",
    "psutil >= 6.0.0",
    "pillow >= 11.0.0",

    # Linux asyncio event loop (container deployment — uvloop over selector loop)
    "uvloop >= 0.21.0 ; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[project.scripts]
tabby-modern = "tabby_modern.__main__:main"

[project.optional-dependencies]
cu128 = [
    # torch 2.12.1+cu132 stable — system nvcc is 13.2; cu132 is the natural target
    # exllamav3 v0.0.43 ships cu132.torch2.11.0 ABI — runtime compat with 2.12.1 is best-effort until upstream adds 2.12.x wheel
    "torch >= 2.12.1",

    # exllamav3 cp314 — updated v0.0.30 → v0.0.43 (2026-06-14); torch2.11.0 ABI (no 2.12.x wheel yet)
    "exllamav3 @ https://github.com/turboderp-org/exllamav3/releases/download/v0.0.43/exllamav3-0.0.43+cu128.torch2.11.0-cp314-cp314-linux_x86_64.whl ; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "exllamav3 @ https://github.com/turboderp-org/exllamav3/releases/download/v0.0.43/exllamav3-0.0.43+cu128.torch2.11.0-cp314-cp314-win_amd64.whl ; platform_system == 'Windows' and python_version == '3.14'",

    # exllamav2 — cp314 gap on ALL platforms as of 2026-04-25 (G4 wall = the wheel, not the code)
    # Linux/Podman: admitted_L2_source_linux (P-08 2026-04-25T19:14:56Z)
    #   Source build via Containerfile STEP 26-27 in chthonic-tabby-modern-gpu:latest (3062c46dac1b)
    #   Installed via: git clone v0.3.2 + uv pip install . --no-build-isolation + tokenizers
    #   TORCH_CUDA_ARCH_LIST="8.9" required — _get_cuda_arch_flags() reads this env var
    #   exllamav2 is PRE-INSTALLED in the container image layer — NOT installed here
    # Win32: impossible_currently — no cp314 wheel; source build not attempted
    # DO NOT add exllamav2 wheel entries for cp314 — none exist. Use container layer.

    # flash_attn 2.8.3 — G6 admitted
    # Linux/Podman: python_only_admitted (FLASH_ATTENTION_SKIP_CUDA_BUILD=TRUE in container)
    #   torch SDPA fallback active; sm_120 + CUTLASS 2.8.3 incompatibility prevents CUDA kernel build
    # Win32: ADMITTED L1 (P-06 source build 2026-04-25T05:45:25Z, MSVC 14.44.35207, 60m 42s)
    "flash-attn == 2.8.3",
]

[tool.uv]
# exllamav3 v0.0.21 pins pydantic==2.11.0 exactly (over-constrained upstream).
# This override forces the resolver past the tight pin — enables pydantic-core 2.46.x (cp314 wheels).
# FAF Gate 1 membrane: docs/reference/FAF_TABBYAPI_PY314_GPU_INFERENCE_HOST.md
override-dependencies = ["pydantic>=2.13.0,<3"]

[tool.uv.sources]
torch = { index = "pytorch-cu132", extra = "cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.extra-build-dependencies]
# flash-attn source build needs torch in isolated build env
# Linux: FLASH_ATTENTION_SKIP_CUDA_BUILD=TRUE bypasses CUDA kernel compilation
flash-attn = ["torch"]
