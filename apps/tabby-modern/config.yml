# tabby-modern configuration
# Backend: exllamav3 (FAF Gate 5 ADMITTED L4 — P-05 cascade + G6 cleared 2026-04-25)
# Container image: chthonic-tabby-modern-gpu:latest (3062c46dac1b)
# Deploy: podman run --device nvidia.com/gpu=0 -p 5000:5000 -v /models:/models:ro chthonic-tabby-modern-gpu:latest
# FAF reference: docs/reference/FAF_TABBYAPI_PY314_GPU_INFERENCE_HOST.md

network:
  # Expose on all adapters — required for container port mapping to host
  host: 0.0.0.0
  port: 5000
  disable_auth: false
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  # Mount models directory at container runtime:
  #   podman run ... -v /path/to/models:/models:ro ...
  model_dir: /models

  # exllamav3 backend — cp314 wheel admitted (G5 L4), import clean after G6 cleared
  # exllamav2 backend also available in container (G4 Linux L2 admitted, source-built in image)
  backend: exllamav3

  # KV cache precision — FP16 baseline for RTX 4090 (24 GB VRAM)
  # Upgrade to Q8/Q6/Q4 if VRAM pressure requires
  cache_mode: FP16

  # Single RTX 4090 — auto-allocate VRAM across the single GPU
  gpu_split_auto: true
  autosplit_reserve: [96]

  # EXL3 output chunking — allocates cache in chunks instead of upfront
  output_chunking: true

  # Prompt ingestion chunk size — 2048 is the sweet spot for RTX 4090 Ada Lovelace
  chunk_size: 2048
