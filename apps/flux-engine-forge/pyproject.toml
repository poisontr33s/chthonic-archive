[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/flux_engine_forge"]

[project]
name = "flux-engine-forge"
version = "0.1.0"
description = "Chthonic FLUX vision satellite — AOT TensorRT engine forge (SM89 / FP8)"
requires-python = ">=3.14"
dependencies = [
    # NO tensorrt / nvidia-modelopt — TRT compilation is delegated to trtexec.exe
    # (native NVIDIA TensorRT C++ SDK binary) via subprocess. This bypasses the
    # cp314 wheel gap entirely; the forge stays on Python 3.14.
    # See memory: project_trt_cp314_gap.md
    "diffusers>=0.30",
    "transformers>=5.4.0,<6",
    "torch>=2.12.1",
    "nvidia-ml-py>=12.0.0",
    "onnx>=1.21.0,<2",
    "onnxruntime-gpu>=1.25.0,<2",
    "onnxscript>=0.6.0,<1",
    "cryptography>=44.0.0",
    "huggingface-hub>=1.8.0,<2",
    "accelerate>=1.0,<2",
]

[project.scripts]
flux-engine-forge = "flux_engine_forge.__main__:main"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
