[package]
name = "chthonic-archive"
version = "0.1.0"
edition = "2024"
authors = ["The Savant <psychonoir@chthonic.archive>"]
description = "The Chthonic Archive: Triumvirate Ascension - ASC-NATIVE-CHAIN-RPG"
license = "WTFPL"
repository = "https://github.com/PsychoNoir/chthonic-archive"

# ╔══════════════════════════════════════════════════════════════════╗
# ║   THE IMPOSSIBLE STACK - Rust/Vulkan/Solana Native              ║
# ║   "We do not accept the CRCs as they are."                       ║
# ║   <69.96 Alpha Omega>                                            ║
# ╚══════════════════════════════════════════════════════════════════╝

[dependencies]
# === WINDOWING ===
winit = "0.30"

# === VULKAN 1.3 (Raw Bindings - Dynamic Rendering + Ray Tracing Ready) ===
ash = { version = "0.38", features = ["loaded", "debug"] }
ash-window = "0.13"

# === GPU MEMORY ===
gpu-allocator = { version = "0.28", features = ["vulkan"] }

# === ENTITY COMPONENT SYSTEM (Per Gemini Directive) ===
bevy_ecs = { version = "0.18.1", optional = true }

# === SERIALIZATION (ASC Lore Ingestion) ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# === MATHEMATICS (Vector/Matrix - The WHR Power Law) ===
glam = "0.32"
rand = "0.10"
sha2 = "0.10"

# === IMAGE I/O (framebuffer capture → PNG for agent self-verify) ===
image = { version = "0.25", default-features = false, features = ["png"] }

# === ASYNC RUNTIME (For Future Solana Integration) ===
tokio = { version = "1.52", features = ["full"] }

# === COPILOT SDK (Rust Technical Preview — embed Copilot agentic engine) ===
# Bumped 2026-05-28 from beta.4 to beta.9 to align with github/copilot-sdk canon.
# See ~/.claude/plans/2-copilot-sdk-vogue-anchor.md, memory `reference-copilot-sdk-rust-beta9`.
# Canon source at meta-ide/copilot-sdk-rust-v1.0.0-beta.9/rust/.
github-copilot-sdk = { version = "1.0.0-beta.9" }

# === LOGGING ===
env_logger = "0.11"
log = "0.4"

# === ERROR HANDLING ===
anyhow = "1.0"
thiserror = "2.0"

[features]
default = ["bevy"]
bevy = ["dep:bevy_ecs"]

# ╔══════════════════════════════════════════════════════════════════╗
# ║   FUTURE: SOLANA BLOCKCHAIN INTEGRATION                          ║
# ║   anchor-lang = "0.28"                                           ║
# ║   solana-sdk = "1.16"                                            ║
# ║   solana-client = "1.16"                                         ║
# ╚══════════════════════════════════════════════════════════════════╝

# ╔══════════════════════════════════════════════════════════════════╗
# ║   BUILD DEPENDENCIES - SHADER COMPILATION                        ║
# ║   shaderc: GLSL → SPIR-V at build time                           ║
# ╚══════════════════════════════════════════════════════════════════╝
[build-dependencies]
shaderc = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[workspace]
members = ["tools/ankh-forge", "tools/chthonic-cai", "tools/copilot-triage", "tools/chthonic-mcp", "tools/chthonic-mcp-server", "tools/dsl-smoke", "tools/dsl-iteration-toolkit"]
resolver = "2"
