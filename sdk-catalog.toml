# Root-managed SDK catalog for one-shot Bun refreshes.
# Kept outside bunfig.toml because bunfig is Bun behavior/configuration,
# not an official dependency-catalog surface.

[catalog]
name = "chthonic-sdk-latest"
defaultTag = "latest"
probeReport = "manifest/sdk-probes/latest.json"

[[managed]]
id = "vscode-dts"
kind = "sdk"
name = "@vscode/dts"
target = "devDependencies"
lane = "vscode"
expected = "cli-only"
official = "https://code.visualstudio.com/api/advanced-topics/using-proposed-api"
probes = []

[[managed]]
id = "vscode-test-electron"
kind = "sdk"
name = "@vscode/test-electron"
target = "devDependencies"
lane = "vscode"
expected = "compatible"
official = "https://code.visualstudio.com/api/working-with-extensions/testing-extension"
probes = ["@vscode/test-electron"]

[[managed]]
id = "vscode-test-web"
kind = "sdk"
name = "@vscode/test-web"
