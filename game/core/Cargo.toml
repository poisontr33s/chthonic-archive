[package]
name = "game-core"
version = "0.1.0"
edition = "2024"

# Standalone workspace so cargo never tries to attach this to a parent workspace.
[workspace]

[[bin]]
name = "game-cli"
path = "src/main.rs"

[lib]
name = "game_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
