[package]
name = "deepseek-core"
version = "0.1.0"
edition = "2021"
description = "Rust JSON-RPC sidecar for the Chthonic VS Code assistant"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs-next = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[workspace]
