<body class="dark font-sans">
  <div id="root"></div>
  <script type="module">
    import { useState, createElement } from 'react';
    import { createRoot } from 'react-dom/client';
    import htm from 'htm';
    const html = htm.bind(createElement);
    import {
      BookOpen, Eye, Activity, Database,
      Menu, X, ChevronRight, ShieldCheck,
      Network, Cpu, Zap, GitBranch
    } from 'lucide-react';

    const cn = (...args) => args.filter(Boolean).join(' ');

    // ── Primitive Components ──────────────────────────────────────────────────

    const Card = ({ children, className }) => html`
      <div className=${cn('rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-2xl shadow-black/40 overflow-hidden', className)}>
        ${children}
      </div>
    `;

    const CardHead = ({ title, subtitle, icon: Icon }) => html`
      <div className="px-6 py-5 border-b border-zinc-800/70 flex items-start gap-4">
        ${Icon && html`<div className="mt-0.5 p-2 bg-blue-500/10 text-blue-400 rounded-lg border border-blue-500/20 shrink-0"><${Icon} size=${17} /></div>`}
        <div>
          <div className="font-semibold text-zinc-100 text-[0.9375rem] leading-tight mb-1">${title}</div>
          ${subtitle && html`<div className="text-xs text-zinc-500">${subtitle}</div>`}
        </div>
      </div>
    `;

    const CardBody = ({ children, className }) => html`
      <div className=${cn('p-6', className)}>${children}</div>
    `;

    const Badge = ({ children, variant = 'default' }) => {
      const map = {
        default: 'bg-zinc-800/80 text-zinc-300 border-zinc-700/60',
        primary: 'bg-blue-500/10 text-blue-300 border-blue-500/25',
        success: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/25',
        warning: 'bg-amber-500/10 text-amber-300 border-amber-500/25',
      };
      return html`<span className=${cn('inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium border', map[variant] ?? map.default)}>${children}</span>`;
    };

    const Mono = ({ children }) => html`
      <code className="px-1.5 py-0.5 rounded bg-zinc-800 text-blue-300 text-[0.8em] font-mono border border-zinc-700/60 leading-none">${children}</code>
    `;

    const DataTable = ({ headers, rows }) => html`
      <div className="overflow-x-auto rounded-xl border border-zinc-800">
        <table className="w-full text-sm text-left border-collapse">
          <thead>
            <tr className="border-b border-zinc-800 bg-zinc-900/90">
              ${headers.map((h, i) => html`<th key=${i} className="px-5 py-3.5 text-[10px] font-bold text-zinc-500 uppercase tracking-widest">${h}</th>`)}
            </tr>
          </thead>
          <tbody>
            ${rows.map((row, i) => html`
              <tr key=${i} className="border-b border-zinc-800/40 hover:bg-zinc-800/20 transition-colors last:border-0">
                ${row.map((cell, j) => html`<td key=${j} className=${cn('px-5 py-4 text-zinc-400 leading-relaxed align-top', j === 0 && 'font-medium text-zinc-200 whitespace-nowrap')}>${cell}</td>`)}
              </tr>
            `)}
          </tbody>
        </table>
      </div>
    `;

    const SectionLabel = ({ icon: Icon, children }) => html`
      <div className="flex items-center gap-2 text-blue-400/80 text-[10px] font-bold uppercase tracking-[0.14em] mb-4">
        ${Icon && html`<${Icon} size=${11} />`}
        <span>${children}</span>
      </div>
    `;

    const H2 = ({ children }) => html`
      <h2 className="text-[1.875rem] font-bold tracking-tight text-zinc-50 leading-tight mb-3">${children}</h2>
    `;

    const Lead = ({ children }) => html`
