# ═══════════════════════════════════════════════════════════════════════════
# CARGO BUILD CONFIGURATION - Chthonic Archive
# ═══════════════════════════════════════════════════════════════════════════
# Optimized for i9-13900 (24 logical cores) with 12-job cap for stability.
# Prevents thermal spikes while keeping UI responsive during builds.

[build]
# 12 parallel jobs = half logical cores on i9-13900
# Balances throughput vs thermal/responsiveness
jobs = 12

[profile.dev]
# Faster incremental builds
incremental = true
# Share generics to reduce compilation time
codegen-units = 16
# Enable debug symbols for better error messages
debug = true

[profile.release]
# Maximum optimization for RTX 4090 + Vulkan workloads
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Windows-specific linker optimizations
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-cpu=native", # Deliberately locked to this i9-13900 dev box — not portable; re-scope before building on/for another machine.
    "-C", "link-arg=/OPT:ICF",
    "-C", "link-arg=/OPT:REF",
    "-C", "link-arg=/DEBUG",
    "-C", "link-arg=/LTCG",
]

# shaderc-sys: link the prebuilt VulkanSDK shaderc instead of building from source.
# Building from source pulls a CMake/Python/Ninja chain that broke 2026-06-20 when the stale
# path here (1.4.341.1, since upgraded) fell through to the from-source build, which then found
# the broken hermes python shim. Lesson: a version-locked path goes stale on SDK bump and fails
# silently. PRIMARY robust fix is a persistent user env var SHADERC_LIB_DIR = %VULKAN_SDK%\Lib
# (REG_EXPAND_SZ) that tracks the installed SDK and overrides this (cargo [env] is force=false,
# so a set env var wins). This repo-tracked value is the fallback for a fresh clone — bump on
# SDK upgrade. (PYTHON_SYS_EXECUTABLE was removed 2026-06-20: it was vestigial —
# no pyo3 crate exists in any workspace and shaderc now links the prebuilt lib, so
# nothing in the build consumes it. A version-pinned interpreter path with no
# consumer is pure latent brittleness; deleting it is the permanent de-brittle.)
[env]
SHADERC_LIB_DIR = "C:\\VulkanSDK\\1.4.350.0\\Lib"
