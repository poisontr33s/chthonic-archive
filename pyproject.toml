[project]
name = "chthonic-archive-tools"
version = "0.1.0"
description = "Repository-wide cross-reference and analysis tools"
requires-python = ">=3.14,<3.15"  # Python 3.14.6 lane only; future versions would need re-audit

dependencies = [
    "networkx>=3.6.1,<4",
    "fastmcp>=3.3",
    "huggingface-hub>=1.8.0,<2",
    "idna>=3.11",
    "numpy>=2.4.3,<3",
    "packaging>=24.2",
    "polars>=1.39.3,<2",
    "rich>=15.0.0,<16",
    "scikit-learn>=1.8.0,<2",
    "sqlite-vec>=0.1.9",
    "peft>=0.19.1",
    "bitsandbytes>=0.49.2",
    "umap-learn>=0.5.12",
    "hdbscan>=0.8.42",
    "einops>=0.8.2",
    "datasets>=4.8.5",
    "triton-windows>=3.6.0.post26",
    "shapely>=2.1.2",
    "imagecodecs>=2026.5.10",
    "qoi>=0.7.2",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
poe-sdk = ["fastapi-poe>=0.0.83,<1"]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "scripts/decorator_cross_ref_maximum.py",
    "scripts/decorator_cross_ref_enhanced.py",
]

[tool.uv.workspace]
members = [
    "mas_mcp",
    "ankh_atlas",
    "apps/flux-engine-forge",
    "apps/flux-satellite",
]

[[tool.uv.index]]
name = "pytorch-nightly-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = false

[tool.uv.sources]
mas-mcp = { workspace = true }
flux-engine-forge = { workspace = true }
flux-satellite = { workspace = true }
torch = { index = "pytorch-nightly-cu128" }

[tool.uv]
default-groups = ["dev", "analysis", "embeddings", "hf", "openai", "poe", "sonic"]
python-downloads = "manual"
python-preference = "only-managed"
index-strategy = "unsafe-best-match"  # Allow searching nightly + stable indices for torch; trust both equally
environments = ["sys_platform == 'win32' and python_full_version >= '3.14.0'"]  # Windows-only lock; Linux container builds independently
override-dependencies = [
    "fsspec>=2026.6.0",    # datasets 5.0.0 caps at 2026.4.0; override is intentional
    "tomlkit>=0.15.0",     # gradio 6.19.0 caps at <0.15.0; test gradio after sync
    "setuptools>=82.0.0",  # torch 2.12.x Requires-Dist: setuptools<82 (conservative build-time pin; not a runtime constraint)
    "tokenizers>=0.23.0rc0,<=0.23.0",  # transformers 5.12.1 caps at <=0.23.0; 0.23.0 never shipped stable; rc0 is the ceiling and satisfies runtime check; cp310-abi3 wheel is Python 3.14 compatible
    "mpmath>=1.4.1",       # sympy 1.14.0 Requires-Dist: mpmath<1.4 (conservative pin; breaking changes land in 1.5.0, not 1.4.x; changelog confirms 1.4.1 is bug-fix only)
    "huggingface-hub>=1.20.1",  # hf-hub 1.17+ Requires-Dist: typer<0.26.0 conflicts with typer>=0.26.7; override clears resolver conflict; hf-hub typer use is CLI-only, API unaffected
    "typer>=0.26.7",            # hf-hub 1.20.1 propagates typer<0.26.0; override silences that downstream cap; typer 0.26.7 is the latest
]

[dependency-groups]
analysis = [
    # radon removed (2026-06-21): blocker on mando via radon<0.8 constraint; code_scent.py can use legacy radon if needed
    "scikit-learn>=1.8.0,<2",
    "scipy>=1.15.0,<2",
    "beautifulsoup4>=4.13.0,<5",
]

embeddings = [
    "sentence-transformers>=5.3.0,<6",
    "transformers>=5.4.0,<6",
    "torch>=2.12.0.dev20260408,<3",  # nightly cu128; dev lower bound enables prerelease resolution
    "onnx>=1.21.0,<2",
    "onnxscript>=0.6.0,<1",
    "onnxruntime-gpu>=1.25.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "accelerate>=1.0,<2",
    "gradio>=6.0.0,<7",
    # onnx: IR + model checker;  onnxscript: dynamo export backend (torch.onnx dynamo=True);
    # onnxruntime-gpu: CUDA/TRT execution provider runtime.
    # Optimum quarantined — caps transformers/hf-hub below the active repo lane.
    # See DEPENDENCY_POLICY.md for full rationale.
]

sonic = [
    "librosa>=0.11.0,<1",
    "panns-inference>=0.1.1,<1",
]

poe = [
    "fastapi-poe>=0.0.83,<1",
]

openai = [
    "openai>=2.30.0,<3",
]

hf = [
    "mcp>=1.26.0,<2",
    "pydantic-settings>=2.13.1,<3",
    "requests>=2.33.0,<3",
    "flask>=3.1.0,<4",
    "flask-cors>=6.0.0,<7",
]

dev = [
    "llama-cpp-python>=0.3.19,<1",
    "pip>=26.0.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "mypy>=1.19.1",
    "mas-mcp",
    # Python 3.14.6 lane: strategic unpins + override pins
    # Removed: radon (blocker on mando), resolved 2026-06-21 aggressive modernization pass
    "sympy>=1.14.0",                    # force stable; avoid rc regression from --prerelease=allow
    "typer>=0.26.7",                    # floor; hf-hub 1.20.1 trade-off resolved via override-dependencies
    "mando>=0.8.0",                     # now available since radon removed
    "pydantic-core>=2.47.0",            # direct pydantic-core override
    # Resolved gates (2026-06-21, were "NOT UPGRADEABLE"):
    # - tokenizers: 0.22.2 → 0.23.0rc0 (cp310-abi3 wheel; override holds rc0 below transformers <=0.23.0 ceiling)
    # - torch: 2.11.0 → 2.12.0.dev20260408+cu128 (nightly index; Windows-only lock via environments)
    # - setuptools: 81.0.0 → 82.0.1 (override breaks torch conservative <82 pin)
    # - mpmath: 1.3.0 → 1.4.1 (override; 1.4.x is bug-fix only; breaking removals land in 1.5.0)
    # - huggingface-hub: 1.16.1 → 1.20.1 (override; typer<0.26.0 from hf-hub metadata silenced)
    # Next trigger: torch 2.12.0 stable on cu128 index → clear nightly pin + dev lower bound
]
