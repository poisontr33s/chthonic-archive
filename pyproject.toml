[project]
name = "chthonic-archive-tools"
version = "0.1.0"
description = "Repository-wide cross-reference and analysis tools"
requires-python = ">=3.14"

dependencies = [
    "networkx>=3.6.1,<4",
    "fastmcp>=3.1.1",
    "huggingface-hub>=1.8.0,<2",
    "idna>=3.11",
    "numpy>=2.4.3,<3",
    "polars>=1.39.3,<2",
    "rich>=14.3.3,<15",
    "scikit-learn>=1.8.0,<2",
]

[project.optional-dependencies]
poe-sdk = ["fastapi-poe>=0.0.83,<1"]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "scripts/decorator_cross_ref_maximum.py",
    "scripts/decorator_cross_ref_enhanced.py",
]

[tool.uv.workspace]
members = [
    "mas_mcp",
    "ankh_atlas",
]

[tool.uv.sources]
mas-mcp = { workspace = true }

[tool.uv]
default-groups = ["dev", "analysis", "embeddings", "hf", "openai", "poe"]

[dependency-groups]
analysis = [
    "radon>=6.0.1,<7",
]

embeddings = [
    "sentence-transformers>=5.3.0,<6",
    "transformers>=5.4.0,<6",
    "torch>=2.11.0,<3",
]

poe = [
    "fastapi-poe>=0.0.83,<1",
]

openai = [
    "openai>=2.30.0,<3",
]

hf = [
    "mcp>=1.26.0,<2",
    "pydantic-settings>=2.13.1,<3",
    "requests>=2.33.0,<3",
]

dev = [
    "llama-cpp-python>=0.3.19,<1",
    "pip>=26.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "mypy>=1.19.1",
    "mas-mcp",
]
