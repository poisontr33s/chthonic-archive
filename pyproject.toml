[project]
name = "chthonic-archive-tools"
version = "0.1.0"
description = "Repository-wide cross-reference and analysis tools"
requires-python = ">=3.14"

dependencies = [
    "networkx>=3.6.1,<4",
    "fastmcp>=3.3",
    "huggingface-hub>=1.8.0,<2",
    "idna>=3.11",
    "numpy>=2.4.3,<3",
    "packaging>=24.2",
    "polars>=1.39.3,<2",
    "rich>=15.0.0,<16",
    "scikit-learn>=1.8.0,<2",
    "sqlite-vec>=0.1.9",
    "peft>=0.19.1",
    "bitsandbytes>=0.49.2",
    "umap-learn>=0.5.12",
    "hdbscan>=0.8.42",
    "einops>=0.8.2",
    "datasets>=4.8.5",
    "triton-windows>=3.6.0.post26",
    "shapely>=2.1.2",
    "imagecodecs>=2026.5.10",
    "qoi>=0.7.2",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
poe-sdk = ["fastapi-poe>=0.0.83,<1"]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "scripts/decorator_cross_ref_maximum.py",
    "scripts/decorator_cross_ref_enhanced.py",
]

[tool.uv.workspace]
members = [
    "mas_mcp",
    "ankh_atlas",
    "apps/flux-engine-forge",
    "apps/flux-satellite",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
mas-mcp = { workspace = true }
flux-engine-forge = { workspace = true }
flux-satellite = { workspace = true }
torch = [{ index = "pytorch-cu128" }]

[tool.uv]
default-groups = ["dev", "analysis", "embeddings", "hf", "openai", "poe"]
python-downloads = "manual"
python-preference = "only-managed"

[dependency-groups]
analysis = [
    "radon>=6.0.1,<7",
    "scikit-learn>=1.8.0,<2",
    "scipy>=1.15.0,<2",
    "beautifulsoup4>=4.13.0,<5",
]

embeddings = [
    "sentence-transformers>=5.3.0,<6",
    "transformers>=5.4.0,<6",
    "torch>=2.11.0,<3",
    "onnx>=1.21.0,<2",
    "onnxscript>=0.6.0,<1",
    "onnxruntime-gpu>=1.25.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "accelerate>=1.0,<2",
    "gradio>=5.0.0,<6",
    # onnx: IR + model checker;  onnxscript: dynamo export backend (torch.onnx dynamo=True);
    # onnxruntime-gpu: CUDA/TRT execution provider runtime.
    # Optimum quarantined — caps transformers/hf-hub below the active repo lane.
    # See DEPENDENCY_POLICY.md for full rationale.
]

poe = [
    "fastapi-poe>=0.0.83,<1",
]

openai = [
    "openai>=2.30.0,<3",
]

hf = [
    "mcp>=1.26.0,<2",
    "pydantic-settings>=2.13.1,<3",
    "requests>=2.33.0,<3",
    "flask>=3.1.0,<4",
    "flask-cors>=5.0.0,<6",
]

dev = [
    "llama-cpp-python>=0.3.19,<1",
    "pip>=26.0.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "mypy>=1.19.1",
    "mas-mcp",
]
