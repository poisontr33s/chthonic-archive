<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
 <!-- Two cartouche tablets — speech as inscribed hieroglyphic cartouches -->
 <!-- Left cartouche (rounded-end rectangle) -->
 <rect x="1" y="1.5" width="6" height="5.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.0"/>
 <path d="M3 3.5h2M3 5h1.5" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>
 <!-- Right cartouche (overlapping, offset) -->
 <rect x="6" y="5" width="6" height="5.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.0"/>
 <path d="M8 7h2M8 8.5h1.5" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>
 <!-- Connecting line (dialogue) -->
 <path d="M5 7l1.5 1" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>
</svg>
