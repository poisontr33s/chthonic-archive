[package]
name = "context-compressor"
version = "0.1.0"
edition = "2024"
description = "Chthonic Neural Bus context packet compressor"
license = "MIT"

# Standalone: nested under the root tree but not a root workspace member. An empty [workspace]
# makes it its own one-crate workspace (decoupled, and self-contained for later pruning).
[workspace]

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.49.0", features = ["full"] }
walkdir = "2.5.0"
