[project]
name = "milfological"
version = "0.1.0"
requires-python = ">=3.12"
description = "MILFOLOGICAL cRPG asset generation pipeline — chthonic-archive"
dependencies = [
    "httpx>=0.27",
    "Pillow>=10.0",
    "pydantic>=2.0",
]

[tool.uv]
python = "3.12"

[project.scripts]
auto-caption = "milfological.auto_caption:main"
entity-cutout = "milfological.entity_cutout:main"
entity-pixelart = "milfological.entity_pixelart:main"
