<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
 <!-- Adze-tupu hybrid — Direction B from ETS_ARCHAEOLOGICAL_TOOLFORM_BASELINE
      Egyptian: adze handle + transverse work edge (right-angle junction)
      Andean: tupu-like semicircular void at head junction -->
 <!-- Handle (diagonal shaft, adze-grip angle) -->
 <path d="M10 14L6.5 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
 <!-- Transverse adze blade (Egyptian right-angle to handle) -->
 <path d="M3.5 4c0-1 .5-2 2-2.5h3c1.5.5 2 1.5 2 2.5L6.5 7" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
 <!-- Tupu void (Andean semicircular perforation at junction) -->
 <circle cx="6.5" cy="5.5" r="1" fill="none" stroke="currentColor" stroke-width="0.8"/>
</svg>
