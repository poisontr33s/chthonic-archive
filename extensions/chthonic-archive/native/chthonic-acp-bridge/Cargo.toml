[package]
name        = "chthonic-acp-bridge"
description = "Chthonic Archive bridge to the Agent Client Protocol. Sibling of chthonic-copilot-bridge; same v9-baseline crate conventions, ACP wire instead of the Copilot SDK's JSON-RPC. TS substrate at extensions/chthonic-archive/src/acp/ is the reference."
version.workspace = true
license.workspace = true

# Edition 2024 (now also the workspace default); the bridge lane tracks the
# github-copilot-sdk 1.0 baseline. MSRV pin dropped — track latest stable.
edition = "2024"

[[bin]]
name = "chthonic-acp-bridge"
path = "src/main.rs"

[dependencies]
# Official Rust ACP crate (Zed's canonical implementation). 0.13.1 is current (modernized from 0.12).
# `unstable` feature mirrors Zed's own pin pattern — required while ACP is pre-1.0.
agent-client-protocol = { version = "0.13.1", features = ["unstable"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Local tokio: needs `full` for child-process + signal + stdio I/O. Workspace
# dep is macros/rt only. Same override as chthonic-copilot-bridge.
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { workspace = true }
