[package]
name = "entropy-ledger-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust ledger sidecar for Chthonic entropy settlements"

[dependencies]
anyhow.workspace = true
borsh.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solana-pubkey.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-signature.workspace = true
solana-instruction.workspace = true
solana-transaction.workspace = true
solana-hash.workspace = true
solana-system-interface.workspace = true
bincode.workspace = true
base64.workspace = true
# Online layer: plain JSON-RPC over HTTP, replacing solana-rpc-client. Mirrors
# chthonic-daemon's reqwest config. The wire protocol is the stable boundary.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# Phantom dep: forces five8_core 0.1.x `std` on so solana-keypair compiles.
# See the workspace.dependencies note. Not referenced in src/.
five8_core.workspace = true
