[workspace]
members = [
    "chthonic-synapse-schema",
    "entropy-ledger-host",
    "entropy-renderer-wasm",
    "chthonic-daemon",
    "tensor-runtime-host",
    "synapse-node",
    "chthonic-copilot-bridge",
    "chthonic-acp-bridge",
    "chthonic-scanner",
    "sonic-daemon",
    "../wasm/chthonic-loom",
    "xtask",
]
resolver = "2"

# Host-only crates build by default; WASM crates require explicit
# `cargo build -p <crate> --target wasm32-unknown-unknown`.
default-members = [
    "entropy-ledger-host",
    "chthonic-daemon",
    "tensor-runtime-host",
    "chthonic-copilot-bridge",
    "chthonic-acp-bridge",
    "chthonic-scanner",
    "sonic-daemon",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
anchor-client = "0.32.1"
anchor-lang = "0.32.1"
ash = "0.38"
borsh = "0.10.4"
clap = { version = "4.6", features = ["derive"] }
# gix 0.84: the hash backend became an explicit feature (was implied by the
# default set pre-0.84). default-features=false drops it, so `sha1` is named
# directly — standard SHA-1 git repos. Swap to `sha256` only for a SHA-256 repo.
gix = { version = "0.84", default-features = false, features = ["max-performance-safe", "sha1"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shaderc = "0.10"
solana-sdk = "2.3.1"
solana-system-interface = "1.0.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
toml = "1.0"
shared_memory = "0.12"
libloading = "0.9"
# Sonic loop — WASAPI loopback capture + DSP (sonic-daemon).
# wasapi crate (not cpal): cpal's WASAPI loopback is disabled upstream (cpal #476),
# fails with AUDCLNT_E_DEVICE_IN_USE. wasapi-rs does render-device + Direction::Capture
# loopback (device) and AUDCLNT_ACTIVATION_TYPE_PROCESS_LOOPBACK (per-process) correctly.
wasapi = "0.23"
# rustfft for spectral features (centroid/flatness) over the rolling window snapshot.
rustfft = "6.2"

# openssl-sys 0.9.114 (2026-04-16 PR #2591) includes OpenSSL 4.0 support natively.
# Git pin removed. Crates.io version resolves correctly against OpenSSL 4.0.0.
