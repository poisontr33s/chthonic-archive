[workspace]
members = [
    "chthonic-synapse-schema",
    "entropy-ledger-host",
    "entropy-renderer-wasm",
    "chthonic-daemon",
    "tensor-runtime-host",
    "synapse-node",
    "../wasm/chthonic-loom",
    "xtask",
]
resolver = "2"

# Host-only crates build by default; WASM crates require explicit
# `cargo build -p <crate> --target wasm32-unknown-unknown`.
default-members = [
    "entropy-ledger-host",
    "chthonic-daemon",
    "tensor-runtime-host",
    "xtask",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
anchor-client = "0.32.1"
anchor-lang = "0.32.1"
ash = "0.38"
borsh = "0.10.4"
clap = { version = "4.5", features = ["derive"] }
gix = { version = "0.71", default-features = false, features = ["max-performance-safe"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shaderc = "0.8"
solana-sdk = "2.3.1"
solana-system-interface = "1.0.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
shared_memory = "0.12"
libloading = "0.8"
