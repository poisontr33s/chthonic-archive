[workspace]
members = [
    "chthonic-synapse-schema",
    "entropy-ledger-host",
    "entropy-renderer-wasm",
    "chthonic-daemon",
    "tensor-runtime-host",
    "synapse-node",
    "chthonic-copilot-bridge",
    "chthonic-acp-bridge",
    "chthonic-scanner",
    "sonic-daemon",
    "../wasm/chthonic-loom",
    "xtask",
]
resolver = "2"

# Host-only crates build by default; WASM crates require explicit
# `cargo build -p <crate> --target wasm32-unknown-unknown`.
default-members = [
    "entropy-ledger-host",
    "chthonic-daemon",
    "tensor-runtime-host",
    "chthonic-copilot-bridge",
    "chthonic-acp-bridge",
    "chthonic-scanner",
    "sonic-daemon",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
ash = "0.38"
# borsh 1.x directly — was reached via anchor-lang's AnchorSerialize, which is
# just borsh. `derive` gives the BorshSerialize macro. (1.x removed the
# try_to_vec() method; use the free fn `borsh::to_vec(&v)`.)
borsh = { version = "1.7", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
# gix 0.84: the hash backend became an explicit feature (was implied by the
# default set pre-0.84). default-features=false drops it, so `sha1` is named
# directly — standard SHA-1 git repos. Swap to `sha256` only for a SHA-256 repo.
gix = { version = "0.84", default-features = false, features = ["max-performance-safe", "sha1"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shaderc = "0.10"
# Solana: granular crates, NOT the solana-sdk umbrella (4.0 deprecates its own
# re-exports → "Use `solana-<x>` crate instead"). Anchor dropped entirely — the
# host hand-rolls discriminator+instruction, so anchor only supplied borsh.
#
# THE ONLINE LAYER IS HAND-ROLLED JSON-RPC (reqwest + serde_json), not
# solana-rpc-client. Online, Solana is a versionless JSON-RPC wire protocol
# (getLatestBlockhash / sendTransaction / getSlot), far more stable than the Rust
# client crate. Dropping rpc-client removes its whole bundled tail AND its version
# coupling — which is what previously force-PINNED solana-transaction down to 3.1.0
# (rpc-client impl'd SerializableTransaction only for that version). With rpc-client
# gone, solana-transaction floats to latest 4.0. The wire bytes are produced exactly
# as rpc-client did: bincode::serialize(&tx) (serde feature → short-vec encoding) →
# base64. The offline dry-run shares this same construction/signing/serialization
# code; the only online-only steps are the three HTTP calls.
#
# curve25519 + sha2: off-chain PDA derivation (find_program_address) is opt-in.
solana-pubkey = { version = "4", features = ["curve25519", "sha2"] }
solana-keypair = "3"
solana-signer = "3"
solana-signature = "3"
solana-instruction = "3"
# 4.0: serde → bincode short-vec wire encoding; wincode → signing (sign /
# new_signed_with_payer); verify → Transaction::verify() for the offline self-check.
solana-transaction = { version = "4", features = ["serde", "wincode", "verify"] }
# decode → Hash::from_str (base58) for the blockhash returned by getLatestBlockhash.
solana-hash = { version = "4", features = ["decode"] }
solana-system-interface = "3"
# Wire serialization (bincode 1.3 = Solana's canonical) + base64 for sendTransaction.
bincode = "1.3"
base64 = "0.22"
# Resolver-hazard fix (NOT scaredy-cat — load-bearing). solana-keypair 3.1.2 pulls
# five8 1.0.0, whose decode_64 returns five8_core::DecodeError. five8's wide range
# (five8_core ">=0.1.1,<2") gets unified DOWN to 0.1.2 because five8_const 1.0.0
# pins 0.1.x. five8_core 0.1.2 is #![no_std] and gates `impl std::error::Error for
# DecodeError` behind #[cfg(feature="std")] — off by default — so keypair's
# from_source(DecodeError) fails to compile. We name five8_core 0.1 with `std` to
# turn that impl on additively (feature unification). Delete only once five8/
# five8_const stop pinning five8_core 0.1.x. Phantom dep — not used in our code.
five8_core = { version = "0.1", features = ["std"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
toml = "1.0"
shared_memory = "0.12"
libloading = "0.9"
# Sonic loop — WASAPI loopback capture + DSP (sonic-daemon).
# wasapi crate (not cpal): cpal's WASAPI loopback is disabled upstream (cpal #476),
# fails with AUDCLNT_E_DEVICE_IN_USE. wasapi-rs does render-device + Direction::Capture
# loopback (device) and AUDCLNT_ACTIVATION_TYPE_PROCESS_LOOPBACK (per-process) correctly.
wasapi = "0.23"
# rustfft for spectral features (centroid/flatness) over the rolling window snapshot.
rustfft = "6.2"

# openssl-sys 0.9.114 (2026-04-16 PR #2591) includes OpenSSL 4.0 support natively.
# Git pin removed. Crates.io version resolves correctly against OpenSSL 4.0.0.
