[package]
name        = "chthonic-copilot-bridge"
description = "Chthonic Archive bridge to the GitHub Copilot SDK. Spawned by the VS Code extension; speaks the Copilot SDK toward the agent and exposes a smoke surface toward the TS shell."
version.workspace = true
license.workspace = true

# Edition 2024 (now also the workspace default); aligns with the GitHub Copilot
# SDK 1.0 baseline. MSRV pin dropped — track latest stable.
edition = "2024"

[[bin]]
name = "chthonic-copilot-bridge"
path = "src/main.rs"

[dependencies]
github-copilot-sdk = { version = "1.0.4" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Local tokio: needs `full` for signal + stdio I/O. Workspace dep is macros/rt only.
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { workspace = true }
