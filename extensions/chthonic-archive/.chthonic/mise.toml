# chthonic-archive Monolithic Slab (Windows 11 native kernel)
#
# Ownership model:
# - mise is kernel + deterministic resolver
# - uv owns Python runtime lifecycle
# - rv owns Ruby runtime lifecycle
# - goup owns system Go runtime lifecycle
#
# Constraint:
# - no registry PATH writes; all PATH state is terminal-memory only.

[tools]
uv = "latest"
rv = "latest"
goup = "latest"
go = "1.26.0"
rust = "stable"
solana-cli = "2.3.1"
agave = "2.3.1"
cargo-binstall = "latest"
cmake = "latest"
ninja = "latest"

[settings]
disable_tools = ["python", "ruby"]

[env]
CHTHONIC_SLAB_MODE = "kernel"
CHTHONIC_RUBY_MIGRATION_FROM = "3.3"
CHTHONIC_RUBY_MIGRATION_TO = "3.4"
CHTHONIC_GO_OWNER = "goup"
CHTHONIC_SOLANA_RUNTIME = "agave"
CHTHONIC_SOLANA_INSTALLER = "solana-install"
CHTHONIC_FIREDANCER_ARTIFACT_DIR = "{{cwd}}/.chthonic/firedancer/artifacts"
CHTHONIC_REACTOR_TRANSPORT = "auto" # set to "jsonl" for Safe Mode fallback
_.path = [
    "{{env.USERPROFILE}}/.local/bin",
    "{{env.USERPROFILE}}/.cargo/bin",
    "{{env.USERPROFILE}}/.goup/current/bin",
    "{{env.MSYS2_HOME}}/ucrt64/bin",
    "{{env.MSYS2_HOME}}/usr/bin",
]

[env."windows"]
CC = "gcc"
CXX = "g++"
RI_DEVKIT = "{{env.MSYS2_HOME}}"
RUBY_MIGRATION_MODE = "in_memory_devkit_injection"

[tasks.agave-sync]
description = "Sync Agave/Solana toolchain lane"
run = "solana-install init stable"

[tasks.firedancer-artifacts]
description = "Prepare Frankendancer artifact directory for native bridge"
run = "pwsh -NoProfile -Command \"New-Item -ItemType Directory -Force -Path .chthonic/firedancer/artifacts | Out-Null\""
